version: 1
backend:
  phases:
    build:
      commands:
        - nvm install 22
        - npm ci --cache .npm --prefer-offline
        - npm run check
        - npm run check:geo
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npm run build
        - npm run test:sitemap
        - npm run test:indexing
        - npm run test:geo
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
